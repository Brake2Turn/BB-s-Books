<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BB's Books</title>
  <meta name="description" content="A personal library for every book BB owns.">
  <meta name="theme-color" content="#F1E9DC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#2B241F" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BB's Books">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preload" href="fonts/fraunces-latin-full-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/instrument-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>BB's Books</h1>
      <p id="count" class="count"></p>
    </div>
    <button id="menuBtn" class="icon-btn" aria-label="Library options" aria-haspopup="true" aria-expanded="false"><i data-icon="more"></i></button>
    <div id="menu" class="menu" hidden>
      <button data-action="export"><i data-icon="download"></i>Back up library</button>
      <label class="menu-item"><i data-icon="upload"></i>Restore from backup<input id="importFile" type="file" accept="application/json,.json" hidden></label>
    </div>
  </header>

  <div class="toolbar">
    <label class="search">
      <i data-icon="search"></i>
      <input id="search" type="search" placeholder="Search your shelves" autocomplete="off" aria-label="Search your library">
    </label>
    <div class="view-toggle" role="group" aria-label="Library view">
      <button data-view="grid" aria-pressed="true" aria-label="Cover grid"><i data-icon="grid"></i></button>
      <button data-view="shelf" aria-pressed="false" aria-label="Shelf of spines"><i data-icon="shelf"></i></button>
    </div>
  </div>
  <div class="filters">
    <label class="quiet-select">
      <span class="visually-hidden">Sort</span>
      <select id="sort">
        <option value="added">Recently added</option>
        <option value="title">Title</option>
        <option value="author">Author</option>
        <option value="rating">Your rating</option>
      </select>
      <i data-icon="chevron"></i>
    </label>
    <label class="quiet-select">
      <span class="visually-hidden">Show</span>
      <select id="filter">
        <option value="">All books</option>
        <option value="want">Want to read</option>
        <option value="reading">Reading</option>
        <option value="read">Read</option>
      </select>
      <i data-icon="chevron"></i>
    </label>
  </div>

  <main>
    <section id="library" class="grid" aria-label="Library"></section>
    <div id="empty" class="empty" hidden>
      <p class="empty-line">Every library begins with a single book.</p>
      <p class="empty-sub">Scan the barcode on the back, or the front cover, to place it on the shelf.</p>
    </div>
    <p id="noMatch" class="empty-sub no-match" hidden>Nothing on the shelves matches that.</p>
  </main>

  <button id="scanBtn" class="fab"><i data-icon="scan"></i>Scan a book</button>

  <!-- Scan -->
  <dialog id="scanner" class="scanner" aria-label="Scan a book">
    <div class="camera">
      <video id="video" playsinline muted></video>
      <div id="frame" class="frame frame-barcode">
        <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      </div>
    </div>

    <div class="scan-top">
      <button class="icon-btn on-dark" data-close aria-label="Close"><i data-icon="x"></i></button>
      <div class="seg on-dark" role="tablist" aria-label="What to scan">
        <button role="tab" data-mode="barcode" aria-selected="true">Barcode</button>
        <button role="tab" data-mode="cover" aria-selected="false">Cover</button>
      </div>
      <span class="spacer"></span>
    </div>

    <div class="scan-bottom">
      <p id="scanHint" class="scan-hint">Hold the barcode on the back inside the frame</p>
      <p id="scanStatus" class="scan-status" aria-live="polite"></p>
      <button id="captureBtn" class="shutter" aria-label="Take photo" hidden></button>
      <div class="scan-alt">
        <label class="chip on-dark"><i data-icon="image"></i>Use a photo<input id="photoInput" type="file" accept="image/*" hidden></label>
        <button id="searchOpen" class="chip on-dark"><i data-icon="search"></i>Search by title</button>
      </div>
    </div>

    <!-- Result sheet -->
    <section id="resultSheet" class="sheet" aria-label="Book found" aria-hidden="true">
      <div class="handle" aria-hidden="true"></div>
      <div class="result-main">
        <div class="result-cover"></div>
        <div class="result-text">
          <p class="label">Found it</p>
          <h2 class="result-title"></h2>
          <p class="result-author"></p>
          <p class="result-meta meta"></p>
        </div>
      </div>
      <p class="result-blurb"></p>
      <p class="result-note" hidden></p>
      <button class="text-btn cover-swap" hidden><i data-icon="camera"></i><span></span></button>
      <div class="sheet-actions">
        <button class="btn primary" data-choice="primary">Add to library</button>
        <button class="text-btn" data-choice="secondary">Not this one</button>
      </div>
    </section>

    <!-- Search / pick-a-match sheet -->
    <section id="listSheet" class="sheet" aria-label="Find a book" aria-hidden="true">
      <div class="handle" aria-hidden="true"></div>
      <h2 class="sheet-title"></h2>
      <p class="sheet-sub"></p>
      <form id="searchForm" class="search sheet-search" hidden>
        <i data-icon="search"></i>
        <input id="searchInput" type="search" placeholder="Title, author or both" autocomplete="off" aria-label="Search for a book" enterkeyhint="search">
      </form>
      <ul id="resultList" class="result-list"></ul>
      <div class="sheet-actions">
        <button id="listBack" class="text-btn">Back to the camera</button>
      </div>
    </section>
  </dialog>

  <!-- Book detail -->
  <dialog id="detail" class="detail" aria-labelledby="dTitle">
    <button class="icon-btn close-detail" data-close aria-label="Back to library"><i data-icon="x"></i></button>
    <div class="detail-scroll">
      <div class="detail-hero"><div class="detail-cover"></div></div>
      <div class="detail-body">
        <h2 id="dTitle" class="detail-title"></h2>
        <p id="dAuthor" class="detail-author"></p>
        <p id="dMeta" class="meta"></p>

        <div class="status seg" role="radiogroup" aria-label="Reading status">
          <button role="radio" data-status="want" aria-checked="false">Want to read</button>
          <button role="radio" data-status="reading" aria-checked="false">Reading</button>
          <button role="radio" data-status="read" aria-checked="false">Read</button>
        </div>

        <section class="detail-section">
          <h3 class="label">Blurb</h3>
          <p id="dBlurb" class="blurb"></p>
        </section>

        <section class="detail-section">
          <h3 class="label">Your rating</h3>
          <div id="stars" class="stars" role="radiogroup" aria-label="Rating out of five"></div>
        </section>

        <section class="detail-section">
          <h3 class="label"><label for="dReview">Your review</label></h3>
          <textarea id="dReview" rows="6" placeholder="What stayed with you?"></textarea>
          <div class="review-actions">
            <button id="saveBtn" class="btn primary">Save review</button>
            <span id="saved" class="meta" aria-live="polite"></span>
          </div>
        </section>

        <section class="detail-section quiet-actions">
          <button id="recoverBtn" class="text-btn"><i data-icon="camera"></i>Use a photo of my copy as the cover</button>
          <button id="deleteBtn" class="text-btn danger"><i data-icon="trash"></i>Remove from library</button>
        </section>
      </div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="vendor/zxing/zxing-reader.js"></script>
  <script src="vendor/tesseract/tesseract.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
